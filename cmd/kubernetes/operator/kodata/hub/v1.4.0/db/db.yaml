apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db
  namespace: tekton-pipelines
  labels:
    app: db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: tekton-pipelines
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:13@sha256:260a98d976574b439712c35914fdcb840755233f79f3e27ea632543f78b7a21e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: db
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                [
                  bash,
                  -c,
                  "psql -w -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1'",
                ]
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 15
          livenessProbe:
            exec:
              command:
                [
                  bash,
                  -c,
                  "psql -w -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1'",
                ]
            initialDelaySeconds: 45
            timeoutSeconds: 2
            periodSeconds: 15
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: db
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: tekton-pipelines
  labels:
    app: db
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
      targetPort: 5432
